micronaut:
    server:
        idle-timeout: 60m
        read-idle-timeout: 60m
        write-idle-timeout: 60m
        port: 8081
    http:
        client:
            read-timeout: 1m

    application:
        name: ia360-demo
    security:
        enabled: ${ENABLE_AUTH:true}
        authentication: bearer
        token:
            jwt:
                signatures:
                    jwks:
                        keycloak:
                            url: http://localhost:8080/realms/ai360-demo/protocol/openid-connect/certs
        oauth2:
            clients:
                keycloak:
                    grant-type: authorization_code
                    client-id: ${KEYCLOAK_CLIENT_ID:demoClientId}
                    client-secret: ${KEYCLOAK_CLIENT_SECRET:JlqrdWhPhhIj738sr2OwPDJJiN93pV7U}
                    token:
                        url: http://${keycloak.host}:${keycloak.port}/realms/${keycloak.realm}/protocol/openid-connect/token
                    openid:
                        issuer: http://${keycloak.host}:${keycloak.port}/realms/${keycloak.realm}
                        jwks-uri: http://${keycloak.host}:${keycloak.port}/realms/${keycloak.realm}/protocol/openid-connect/certs


logger:
    levels:
        io.micronaut: TRACE
        com.demo: TRACE

keycloak:
    host: ${KEYCLOAK_HOST:localhost}
    port: ${KEYCLOAK_PORT:8080}
    realm: ${KEYCLOAK_REALM:ai360-demo}
    redirect-uri: http://localhost:8081/callback #da sistemare con variabile...

